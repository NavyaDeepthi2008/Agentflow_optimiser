[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-backend"
version = "0.8.0"
description = "AgentFlow Optimizer backend: tool gateway, runtime optimizer, Gemini agent, evaluation and learning engine, API."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "google-genai>=2.29,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx2>=2.0",  # used by FastAPI's TestClient
]

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -m 'not live'"
markers = [
    "live: calls the real Gemini API (needs GEMINI_API_KEY and RUN_LIVE_TESTS=1; costs money)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
