# Alembic command-line configuration.
# The app runs migrations itself on startup; this file is for manual use, e.g.:
#   .venv/bin/alembic upgrade head
#   .venv/bin/alembic revision --autogenerate -m "describe change"
# The database URL is read from DATABASE_URL (default sqlite:///./agentflow.db).

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
